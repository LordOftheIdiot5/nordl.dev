name: Optional rendered layout audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/layout-audit.yml'
      - 'scripts/layout-audit.cjs'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Render published homepage at desktop and mobile widths
        run: node scripts/layout-audit.cjs https://nordl.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nordl-layout-audit
          path: layout-report/
